name: Check and publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to check and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3
      - run: nix flake show --all-systems
      - run: nix flake check -L

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        toolchain: [toolchain-go1_25, toolchain-go1_26, toolchain-go1_26_6]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3
        with:
          extra-conf: |
            extra-experimental-features = ca-derivations dynamic-derivations recursive-nix
            extra-system-features = recursive-nix ca-derivations
      - name: Differential builds, cache invalidation, and dynamic integration
        env:
          TOOLCHAIN_ATTR: ${{ matrix.toolchain }}
        run: |
          tc=$(nix build ".#$TOOLCHAIN_ATTR" --no-link --print-out-paths --max-jobs 2 --cores 2)
          export DRVGO_MATRIX_TC="$tc"
          nix-shell --run 'set -e; make build; go test -c -tags integration -o /tmp/drvgo-integration.test ./internal/export; python3 tests/compatibility.py --toolchain "$DRVGO_MATRIX_TC" --drvgo bin/drvgo --integration-test /tmp/drvgo-integration.test --flake-toolchain "$TOOLCHAIN_ATTR"'

  flakehub:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3
      - uses: DeterminateSystems/flakehub-push@dceefcb33cba27bde28f8540d8b4537cb925c46b
        with:
          name: ryantm/drvgo
          tag: ${{ inputs.tag || github.ref_name }}
          visibility: public
          spdx-expression: CC0-1.0

  flakestry:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [check, compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: flakestry/flakestry-publish@08cfeb3dc22bf4e2df64ba84e8dae19918e44e0b
        with:
          version: ${{ inputs.tag || github.ref_name }}
          ref: ${{ inputs.tag || github.sha }}
